# MyCV - https://mycv.coffeesos.online
# Static SPA (React/Vite) published to /var/www/mycv.coffeesos.online
# Install: copy to /etc/nginx/conf.d/, `nginx -t && systemctl reload nginx`,
# then `certbot --nginx -d mycv.coffeesos.online --redirect` adds the TLS block.

server {
    listen 80;
    listen [::]:80;
    server_name mycv.coffeesos.online;

    root /var/www/mycv.coffeesos.online;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Content-hashed build assets: cache forever
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA shell: never cache so a new build is picked up immediately
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
