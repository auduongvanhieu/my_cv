# MyCV - https://mycv.coffeesos.online
# Static SPA (React/Vite) published to /var/www/mycv.coffeesos.online
# API (Go, mycv-server.service) listens on 127.0.0.1:7801 and is exposed under /api/.
# TLS lines below were produced by `certbot --nginx -d mycv.coffeesos.online --redirect`
# and are kept here so re-installing this file does not lose HTTPS.

upstream mycv_api {
    server 127.0.0.1:7801;
    keepalive 16;
}

server {
    server_name mycv.coffeesos.online;

    root /var/www/mycv.coffeesos.online;
    index index.html;
    client_max_body_size 5m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://mycv_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Content-hashed build assets: cache forever
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA shell: never cache so a new build is picked up immediately
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mycv.coffeesos.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mycv.coffeesos.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = mycv.coffeesos.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name mycv.coffeesos.online;
    return 404; # managed by Certbot
}
